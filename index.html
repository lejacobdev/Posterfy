<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0b0b0f" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f7f7f5" media="(prefers-color-scheme: light)" />

    <title>Posterfy — Turn any album into a print-ready poster</title>
    <meta
      name="description"
      content="Search an album, pick a layout, tweak the colours and download a high-resolution poster you can print. Free, no account needed, runs entirely in your browser."
    />
    <link rel="canonical" href="https://posterfy.app/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Posterfy" />
    <meta property="og:title" content="Posterfy — Turn any album into a print-ready poster" />
    <meta
      property="og:description"
      content="Search an album, pick a layout, tweak the colours and download a high-resolution poster you can print."
    />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:url" content="https://posterfy.app/" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Posterfy — Turn any album into a print-ready poster" />
    <meta
      name="twitter:description"
      content="Search an album, pick a layout, tweak the colours and download a high-resolution poster you can print."
    />
    <meta name="twitter:image" content="/og-image.png" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <link
      rel="preload"
      href="/fonts/archivo-400800-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/space-mono-400-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Posterfy",
        "url": "https://posterfy.app/",
        "applicationCategory": "DesignApplication",
        "operatingSystem": "Any",
        "description": "Turn any album into a print-ready poster. Search an album, customise the layout and download it in high resolution.",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
      }
    </script>

    <script>
      // Apply the stored theme before first paint to avoid a flash of the wrong palette.
      (function () {
        try {
          var stored = localStorage.getItem('posterfy.settings');
          var theme = stored ? JSON.parse(stored).theme : null;
          if (theme === 'system' || !theme) {
            theme = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
          }
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {
          /* keep the default theme */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div style="padding: 2rem; font-family: system-ui, sans-serif">
        <h1>Posterfy needs JavaScript</h1>
        <p>
          Posters are rendered in your browser with the Canvas API, so JavaScript has to be enabled.
        </p>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
