name: Deploy to GitHub Pages

# Publishes the static build to GitHub Pages.
#
# One-time setup: repository Settings → Pages → Build and deployment →
# Source: "GitHub Actions".
#
# The Pages build is static, so there is no server to hold a Spotify secret.
# Album search there uses the keyless MusicBrainz + Cover Art Archive provider,
# and visitors can add their own Spotify credentials under Settings. To give
# every visitor Spotify search, deploy the Node server or the serverless
# function instead (see README → Deployment).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build
        env:
          # Project pages are served from /<repo>/ rather than the domain root.
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
          VITE_SITE_URL: ${{ format('https://{0}.github.io/{1}', github.repository_owner, github.event.repository.name) }}
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
